name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          ZIP=$(ls *.zip | head -n1)
          unzip -q "$ZIP" -d project
          DIR=$(dirname "$(find project -name settings.gradle.kts | head -n1)")
          echo "PROJ=$DIR" >> $GITHUB_ENV
          echo "Project dir: $DIR"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
        working-directory: ${{ env.PROJ }}

      - uses: actions/upload-artifact@v4
        with:
          name: JumpBot-apk
          path: ${{ env.PROJ }}/app/build/outputs/apk/debug/app-debug.apk
