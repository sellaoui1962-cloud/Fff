name: Build Neggaza APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          if [ -f Neggaza.zip ]; then ZIP=Neggaza.zip; else ZIP=$(ls *.zip | head -n1); fi
          echo "Using: $ZIP"
          unzip -q "$ZIP" -d project
          DIR=$(dirname "$(find project -name settings.gradle.kts | head -n1)")
          echo "PROJ=$DIR" >> $GITHUB_ENV
          echo "Project dir: $DIR"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
        working-directory: ${{ env.PROJ }}

      - uses: actions/upload-artifact@v4
        with:
          name: Neggaza-apk
          path: ${{ env.PROJ }}/app/build/outputs/apk/debug/app-debug.apk
